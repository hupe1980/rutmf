# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:  cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any known vulnerability or unmaintained crate in the tree.
yanked = "deny"
ignore = []

[licenses]
# This crate is MIT OR Apache-2.0 and vendors Apache-2.0 specification material.
# Dependencies must be usable under those terms by anyone who takes a copy.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here should ever pull in a second async runtime or TLS stack.
deny = [
    { name = "openssl-sys", reason = "rustls is the only TLS backend this crate enables" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
