name: release

# Publishing to crates.io cannot be undone: a version is permanent and a yank
# does not free the number. So the tag is verified against the manifest and the
# changelog, the suite is re-run on the tagged commit, and the GitHub release is
# only cut once the publish has succeeded.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse, e.g. v0.1.0. Verifies only; publishes nothing."
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: tag
        name: Read the tag
        # Interpolated through the environment rather than into the script, so a
        # tag name cannot become shell.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag carrying a pre-release identifier (`v0.2.0-rc.1`) is marked as
          # one on the release, so it does not show as the latest version.
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "releasing $version"

      # A tag that disagrees with the manifest publishes the wrong number under
      # the right name, and the mistake is only visible on crates.io afterwards.
      - name: The tag matches Cargo.toml
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          manifest=$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)
          tagged="$VERSION"
          if [ "$manifest" != "$tagged" ]; then
            echo "::error::tag says $tagged, Cargo.toml says $manifest"
            exit 1
          fi
          echo "$manifest"

      # `Cargo.lock` is committed, and `cargo publish --locked` below will fail
      # if it does not already name this version. Catching that here says why.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: The changelog has a section for it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — move the Unreleased entries under it"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The same gates `ci.yml` applies, re-run on the exact commit being
      # published. CI runs on the pull request; nothing otherwise guarantees the
      # tag points at what CI saw.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --all-features --all-targets
      - run: cargo test --all-features --doc

      # Builds the crate as it will actually ship — `specs/` and `tests/` are
      # excluded, so this is the first thing to fail if an `include`/`exclude`
      # change left the package unable to compile.
      - run: cargo publish --locked --dry-run

  publish:
    name: publish to crates.io
    needs: verify
    # Rehearsals stop after `verify`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Scope `CARGO_REGISTRY_TOKEN` here, and add a required reviewer on this
    # environment to gate the one step that cannot be undone.
    environment:
      name: crates-io
      url: https://crates.io/crates/rutmf
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: github release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The changelog is the release notes; keeping a second copy by hand is how
      # the two stop agreeing.
      - name: Extract the changelog section
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Ends at the next version heading, or at the link-reference block the
          # Keep a Changelog format puts at the foot of the file.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          # Trim trailing blank lines.
          printf '%s\n' "$(cat notes.md)" > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::no changelog body for $VERSION"
            exit 1
          fi

          # A release body is capped at 125,000 characters. A changelog section
          # can exceed that, and `gh` fails with an unhelpful 422.
          size=$(wc -c < notes.md)
          echo "notes: $size characters"
          if [ "$size" -gt 120000 ]; then
            head -c 119000 notes.md > trimmed.md
            printf '\n\n…truncated. The full entry is in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> trimmed.md
            mv trimmed.md notes.md
            echo "::warning::changelog section exceeded the release body limit and was truncated"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}"
