name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV is declared in Cargo.toml; test it explicitly so a bump is a
        # deliberate change rather than an accident. 1.88 is forced by
        # let-chains in this crate and by bon's own MSRV.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `--all-features` is what runs the two suites that matter: the
      # conformance corpus and the schema-coverage gate.
      - run: cargo test --all-features --all-targets
      - run: cargo test --all-features --doc
      # A default-feature checkout is what a new contributor runs first; it
      # must build and pass on its own.
      - run: cargo test --all-targets
      - run: cargo build --examples --all-features

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each slice must build alone: the domain model must never need the
      # client layer, and no default feature may drag in a TLS stack.
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features party
      - run: cargo check --no-default-features --features customer
      - run: cargo check --no-default-features --features product
      - run: cargo check --no-default-features --features order
      - run: cargo check --no-default-features --features service
      - run: cargo check --no-default-features --features resource
      - run: cargo check --no-default-features --features api
      - run: cargo check --no-default-features --features api-tmf620
      - run: cargo check --no-default-features --features ticket
      - run: cargo check --no-default-features --features api-tmf621
      - run: cargo check --no-default-features --features api-tmf622
      - run: cargo check --no-default-features --features api-tmf629
      - run: cargo check --no-default-features --features api-tmf632
      - run: cargo check --no-default-features --features api-tmf634
      - run: cargo check --no-default-features --features alarm
      - run: cargo check --no-default-features --features api-tmf642
      - run: cargo check --no-default-features --features bill
      - run: cargo check --no-default-features --features account
      - run: cargo check --no-default-features --features api-tmf666
      - run: cargo check --no-default-features --features api-tmf678
      - run: cargo check --no-default-features --features api-tmf637
      - run: cargo check --no-default-features --features api-tmf638
      - run: cargo check --no-default-features --features api-tmf639
      - run: cargo check --no-default-features --features api-tmf669
      - run: cargo check --no-default-features --features api-tmf679
      - run: cargo check --no-default-features --features server
      - run: cargo check --no-default-features --features server-axum
      - run: cargo check --no-default-features --features mock
      - run: cargo check --no-default-features --features schemars
      - run: cargo check --no-default-features --features transport-reqwest
      # Combinations a consumer actually assembles. These are not implied by
      # the slices above: `server` with no per-API client, and `api` with no
      # domain, are the shapes where a macro or an import goes unused — which
      # `RUSTFLAGS: -D warnings` turns into a failure, and which nothing else
      # here would exercise.
      - run: cargo check --no-default-features --features mock,api-tmf620
      - run: cargo check --no-default-features --features server-axum,transport-reqwest,api-tmf620
      - run: cargo check --no-default-features --features api,schemars
      - run: cargo check --no-default-features --features full
      - run: cargo check --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets

  wasm:
    name: wasm32 (core is I/O-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features party,customer,product,order,service,resource,ticket,alarm,bill,account

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Mirrors the docs.rs build, so a broken intra-doc link fails here first.
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` verifies the published crate compiles from what is
      # actually shipped — which is how a missing file in `include`/`exclude`
      # gets caught before a release rather than after one.
      - run: cargo package --allow-dirty
      # The specifications and fixtures are excluded on purpose; if they creep
      # back in, the download quadruples for every consumer.
      - name: The package carries no vendored corpus
        run: |
          set -euo pipefail
          if cargo package --list --allow-dirty | grep -Eq '^(specs|tests)/'; then
            echo "::error::specs/ or tests/ leaked into the package"
            exit 1
          fi

  spec-drift:
    name: spec drift
    runs-on: ubuntu-latest
    # Informational: TM Forum publishes patch releases without notice, and the
    # vendored fixtures should be refreshed deliberately, not silently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Compare vendored OAS documents against upstream
        run: |
          set -uo pipefail
          base=https://raw.githubusercontent.com/tmforum-apis
          check() {
            local repo="$1" file="$2"
            # The vendored file is named exactly as upstream names it. If it is
            # not, this job silently compares nothing — so a missing local file
            # is an error rather than a warning.
            if [ ! -f "specs/$file" ]; then
              echo "::error::specs/$file does not exist; the vendored name must match upstream"
              return 1
            fi
            curl -sSfL "$base/$repo/main/$file" -o upstream.yaml || {
              echo "::warning::could not fetch $repo/$file — if this persists, the repository name here is wrong, not the network"
              return 0; }
            if diff -q "specs/$file" upstream.yaml >/dev/null; then
              echo "$file is current"
            else
              echo "::warning::$file changed upstream — refresh specs/ and tests/fixtures/"
              diff "specs/$file" upstream.yaml | head -30 || true
            fi
          }
          check TMF620_ProductCatalog     TMF620-Product_Catalog_Management-v5.0.0.oas.yaml
          check TMF621_TroubleTicket      TMF621-Trouble_Ticket-v5.0.1.oas.yaml
          check TMF622_ProductOrder       TMF622-ProductOrdering-v5.0.0.oas.yaml
          check TMF629_CustomerManagement TMF629-Customer_Management-v5.0.1.oas.yaml
          check TMF632_PartyManagement    TMF632-Party_Management-v5.0.0.oas.yaml
          check TMF634_ResourceCatalog    TMF634-Resource_Catalog_Management-v5.0.0.oas.yaml
          check TMF642_AlarmManagement    TMF642_Alarm_v5.0.1.oas.yaml
          check TMF666_AccountManagement  TMF666-Account_Management-v5.0.0.oas.yaml
          check TMF678_CustomerBill       TMF678-CustomerBill-v5.0.0.oas.yaml
          check TMF637_ProductInventory   TMF637-ProductInventory-v5.0.0.oas.yaml
          check TMF638_ServiceInventory   TMF638-Service_Inventory_Management-v5.0.0.oas.yaml
          check TMF639_ResourceInventory  TMF639-Resource_Inventory_Management-v5.0.0.oas.yaml
          check TMF669_PartyRole          TMF669-Party_Role_Management-v5.0.0.oas.yaml
          check TMF679_ProductOfferingQualification TMF679-Product_Offering_Qualification-v5.0.0.oas.yaml

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Checks advisories, licences, banned crates and source registries
      # against deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    # Informational until 1.0: the API is expected to move, but an unintended
    # break should still be visible in the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
