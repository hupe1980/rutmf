name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Allow one deployment at a time, and let a newer push supersede a queued one
# rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zola
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
          zola --version

      # `check` validates every internal link and every external one that is not
      # skipped in config.toml, so a renamed page or a moved TM Forum URL fails
      # here rather than silently 404ing for a reader.
      - name: Check links
        working-directory: site
        run: zola check

      # The site quotes figures that the Rust test suite asserts. Keeping them in
      # step by hand is exactly the drift that put "176 examples" in one file and
      # "234" in another, so the numbers are compared here instead.
      - name: Figures match the test suite
        run: |
          set -euo pipefail
          fail=0
          check() {
            local label="$1" expected="$2" actual="$3"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$label: site says '$actual', tests say '$expected'"
              fail=1
            else
              echo "$label: $actual"
            fi
          }

          fixtures=$(grep -oP 'const TOTAL_FIXTURES: usize = \K[0-9]+' tests/conformance.rs)
          types=$(grep -oP 'const MAPPED_TYPE_COUNT: usize = \K[0-9]+' tests/coverage.rs)
          schemas=$(grep -oP 'const MAPPED_SCHEMA_COUNT: usize = \K[0-9]+' tests/coverage.rs)
          # Match the APIS table's three-tuple shape specifically; the file also
          # contains two-tuple `("tmf620", "productoffering")` dispatch arms.
          apis=$(grep -cP '^\s+\("tmf[0-9]+", "[0-9.]+", [0-9]+\),' tests/conformance.rs)

          site_get() { grep -oP "^$1 = \"\K[0-9]+" site/config.toml; }

          check "fixture_count" "$fixtures" "$(site_get fixture_count)"
          check "type_count"    "$types"   "$(site_get type_count)"
          check "schema_count"  "$schemas" "$(site_get schema_count)"
          check "api_count"     "$apis"    "$(site_get api_count)"

          exit $fail

      - name: Build
        working-directory: site
        run: zola build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: deploy
    # Only main publishes; a pull request gets the build and link check above,
    # which is the part that can fail.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
